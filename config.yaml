# Kraken Funded $1K-Challenge – Regeln und Risiko-Einstellungen.
# Quelle: support.kraken.com/articles/funded (Stand Okt. 2026).
# Während einer laufenden Challenge die Risiko-Werte NICHT lockern.

challenge:
  start_balance: 1000
  profit_target_pct: 12        # bestanden bei 1.120 $
  max_drawdown_pct: 3          # 30 $ Puffer
  # Kraken: "The max loss is always calculated against your starting balance, not your peak."
  # -> feste Grenze bei 970 $, gilt auch nach dem Bestehen (Funded-Konto).
  trailing_drawdown: false
  # true: die mitwandernde Grenze steigt nie über den Startwert (1.000 $).
  trailing_locks_at_start: false

risk:
  risk_per_trade_pct: 0.75     # max. 7,50 $ Verlust pro Trade
  max_room_fraction: 0.5       # nie mehr als die Hälfte des Restpuffers auf einen Trade
  protect_fraction: 0.8        # offene Stops dürfen zusammen max. 80 % des Puffers kosten
  min_reward_risk: 3.0         # Ziel mindestens 3x so weit weg wie der Stop
  max_open_positions: 2        # offene Positionen + wartende Orders
  max_crypto_positions: 1      # Krypto läuft fast immer gleich: max. 1 Krypto-Trade
  max_position_pct: 60         # max. 60 % des Kontos in einer Position
  min_stop_pct: 0.5
  max_stop_pct: 6
  pause_after_losses: 2        # nach 2 Verlusten in Folge: Rest des Tages Pause
  daily_loss_limit_pct: 1.5    # nach 15 $ Tagesverlust: Rest des Tages Pause
  allow_fractional: true

execution:
  entry_slippage_cap_pct: 0.3  # Einstieg max. 0,3 % über Plan, sonst keine Ausführung
  stop_exit_slippage_pct: 0.05 # Stop-Ausführung etwas schlechter als der Stop
  spread_pct: 0.04             # Kraken: 0,04 % Spread je Seite (Kauf und Verkauf)
  crypto_order_hours: 24       # Krypto-Orders gelten 24 Stunden (Aktien: bis Börsenschluss)

# Phase 2: nach dem Bestehen (+12 %) wird mit dem Funded-Konto weitergehandelt.
# Die 970-$-Grenze bleibt laut Kraken bestehen, aber mit wachsendem Konto wird der Puffer größer.
funded:
  goal_equity: 10000           # Ziel des Nutzers; bei Erreichen stoppt der Bot neue Trades
  risk:                        # überschreibt die Werte aus `risk` in Phase 2
    risk_per_trade_pct: 1.0
    max_room_fraction: 0.25
    min_reward_risk: 2.0
    max_open_positions: 3
    daily_loss_limit_pct: 3

# Aggressiv-Modus: vom Nutzer am 29.10. gewählt, um das Ziel bis Freitag zu versuchen.
# Nur für das Paper-Konto. Endet automatisch zum Zeitpunkt `until`; danach gelten wieder `risk`.
# Kein Hebel (Kraken Funded): mehr Risiko heißt größere Position und weiterer Stop.
aggressive:
  enabled: true
  until: "2026-10-30T22:00:00+01:00"
  risk:
    risk_per_trade_pct: 1.8      # ca. 18 $ pro Trade, zwei Verluste ≈ Grenze
    max_position_pct: 100        # ganzes Konto in einer Position erlaubt
    daily_loss_limit_pct: 4      # die 970-$-Grenze ist die eigentliche Bremse
